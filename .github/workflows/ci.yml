name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python -m prompt_to_app.cli "Build a simple habit tracker with habits, checkboxes, and completion status" --serve --browser --ollama-url http://127.0.0.1:1 --output ./ci-habit-tracker
