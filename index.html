<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt → App</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="badge">PROMPT → APP</div><h1>Build an app from a prompt.</h1><p class="sub">Describe what you want. The cloud builder plans, generates, verifies, repairs, and deploys it.</p><form id="build-form"><textarea id="prompt" placeholder="Build a habit tracker with checkboxes and completion status" required></textarea><button id="build" type="submit">Build app</button></form><div id="status" class="status" hidden></div><a id="result" class="result" target="_blank" rel="noopener" hidden>Open your app →</a></main><script>const form=document.querySelector('#build-form'),prompt=document.querySelector('#prompt'),button=document.querySelector('#build'),status=document.querySelector('#status'),result=document.querySelector('#result');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.hidden=false;result.hidden=true;status.textContent='Building…';try{const r=await fetch('/api/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:prompt.value})});const data=await r.json();if(!r.ok)throw new Error(data.detail?.errors?.join?.(', ')||data.detail||'Build failed');status.textContent='Ready.';result.href=data.url;result.hidden=false}catch(err){status.textContent=err.message}finally{button.disabled=false}})</script></body></html>
