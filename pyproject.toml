[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-to-app"
version = "0.8.2"
description = "Natural-language Prompt → App orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.141.1", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.50"]

[project.scripts]
prompt-to-app = "prompt_to_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
